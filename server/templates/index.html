<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WifiDoorbell Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-1: #8b5cf6;
            --accent-2: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out;
        }
        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
            .header { grid-column: 1 / -1; }
        }
        .header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .header p { color: var(--text-muted); }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }
        
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 400; }
        input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: var(--accent-1);
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }
        
        button {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }
        button:active { transform: scale(0.98); }
        
        .log-container {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 1rem;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            color: #a7f3d0;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        
        .log-entry {
            animation: slideIn 0.3s ease-out;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: var(--text-muted); margin-right: 0.5rem; }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 1rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent-1);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 600;
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        
        .device-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .device-table th, .device-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--glass-border); font-size: 0.9rem; }
        .device-table th { color: var(--accent-1); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        .device-table tr:hover td { background: rgba(255,255,255,0.02); }
        .mac-address { font-family: monospace; color: #a7f3d0; background: rgba(0,0,0,0.3); padding: 0.2rem 0.5rem; border-radius: 4px; }
        .vendor-name { font-weight: 600; color: var(--text-main); }
        .time-badge { font-size: 0.8rem; color: var(--text-muted); }

        .tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .tab-btn.active { background: var(--accent-1); color: white; border-color: var(--accent-1); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WifiDoorbell</h1>
            <p>Server Control Panel</p>
            <div class="status-badge">● Server Online</div>
        </div>
        
        <div class="glass-panel">
            <h2>⚙️ Configuration</h2>
            <form id="configForm">
                <div class="form-group">
                    <label for="macAddress">Target MAC Address</label>
                    <input type="text" id="macAddress" placeholder="e.g. AA:BB:CC:DD:EE:FF" required>
                </div>
                <div class="form-group">
                    <label for="fcmToken">FCM Device Token</label>
                    <input type="text" id="fcmToken" placeholder="Paste token from Android app here..." required>
                </div>
                <button type="submit">Save & Apply Settings</button>
            </form>
        </div>
        
        <div class="glass-panel">
            <h2>📡 Live Terminal</h2>
            <div class="log-container" id="logContainer">
                <!-- Logs will be injected here -->
            </div>
        </div>
        <div class="glass-panel" style="grid-column: 1 / -1;">
            <h2>📱 Network Devices History</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabAll" onclick="setFilter('all')">Todos</button>
                <button class="tab-btn" id="tabPhones" onclick="setFilter('phones')">📱 Apenas Celulares</button>
            </div>
            <div style="overflow-x: auto;">
                <table class="device-table">
                    <thead>
                        <tr>
                            <th>MAC Address</th>
                            <th>IP Address</th>
                            <th>Manufacturer</th>
                            <th>First Seen</th>
                            <th>Last Connected</th>
                        </tr>
                    </thead>
                    <tbody id="devicesTableBody">
                        <!-- Devices injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast">Settings Saved Successfully! ✨</div>

    <script>
        const macInput = document.getElementById('macAddress');
        const fcmInput = document.getElementById('fcmToken');
        const logContainer = document.getElementById('logContainer');
        const form = document.getElementById('configForm');
        const toast = document.getElementById('toast');
        let lastLogCount = 0;

        // Fetch initial config
        fetch('/api/config')
            .then(res => res.json())
            .then(data => {
                macInput.value = data.TARGET_MAC || '';
                fcmInput.value = data.DEVICE_FCM_TOKEN || '';
            });

        // Save config
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = 'Saving...';
            
            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    TARGET_MAC: macInput.value,
                    DEVICE_FCM_TOKEN: fcmInput.value
                })
            }).then(() => {
                btn.textContent = originalText;
                showToast();
            });
        });

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Fetch logs periodically
        function fetchLogs() {
            fetch('/api/logs')
                .then(res => res.json())
                .then(logs => {
                    if (logs.length !== lastLogCount) {
                        logContainer.innerHTML = '';
                        logs.forEach(log => {
                            const entry = document.createElement('div');
                            entry.className = 'log-entry';
                            // Extract time and message (assuming format: [YYYY-MM-DD HH:MM:SS] Message)
                            const match = log.match(/\[(.*?)\] (.*)/);
                            if (match) {
                                entry.innerHTML = `<span class="log-time">[${match[1]}]</span>${match[2]}`;
                            } else {
                                entry.textContent = log;
                            }
                            logContainer.appendChild(entry);
                        });
                        logContainer.scrollTop = logContainer.scrollHeight;
                        lastLogCount = logs.length;
                    }
                });
        }

        setInterval(fetchLogs, 1000);
        fetchLogs();
        
        let currentFilter = 'all';
        let allDevices = [];

        function setFilter(filterType) {
            currentFilter = filterType;
            document.getElementById('tabAll').classList.toggle('active', filterType === 'all');
            document.getElementById('tabPhones').classList.toggle('active', filterType === 'phones');
            renderDevices();
        }

        // Fetch devices history
        function fetchDevices() {
            fetch('/api/devices')
                .then(res => res.json())
                .then(devices => {
                    allDevices = devices;
                    renderDevices();
                });
        }
        
        function renderDevices() {
            const tbody = document.getElementById('devicesTableBody');
            tbody.innerHTML = '';
            
            const phoneBrands = ['apple', 'samsung', 'motorola', 'xiaomi', 'huawei', 'oppo', 'vivo', 'realme', 'google', 'oneplus', 'nokia', 'sony', 'lg'];
            
            const filtered = allDevices.filter(dev => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'phones') {
                    const vendor = (dev.vendor || '').toLowerCase();
                    return phoneBrands.some(brand => vendor.includes(brand));
                }
                return true;
            });
            
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Nenhum dispositivo encontrado nesta categoria.</td></tr>`;
                return;
            }

            filtered.forEach(dev => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="mac-address">${dev.mac}</span></td>
                    <td><span style="font-family: monospace; color: #93c5fd;">${dev.ip || '-'}</span></td>
                    <td><span class="vendor-name">${dev.vendor}</span></td>
                    <td><span class="time-badge">${dev.first_seen}</span></td>
                    <td><span class="time-badge">${dev.last_seen}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        setInterval(fetchDevices, 2000);
        fetchDevices();
    </script>
</body>
</html>
